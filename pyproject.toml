[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garage-s3-lab"
version = "0.2.0"
description = "Laboratório Garage S3 (Sistemas Distribuídos, UNIVALI): Tema 3, Ênfase A"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "boto3>=1.36",
    "docker>=7.1",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
labctl = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*", "painel*"]

[tool.setuptools.package-data]
painel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa do cluster real no ar (make test-integration)"]

[tool.ruff]
line-length = 120
target-version = "py311"
