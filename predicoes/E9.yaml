experimento: E9
titulo: Ênfase A — modos de consistência sob partição
roteiro: "§7.5 Ênfase A: comparar consistent, degraded e dangerous; provocar partição, escrever pelo lado majoritário e ler pelo minoritário; medir a taxa de leituras desatualizadas e a disponibilidade em cada modo"
previsoes:
  - id: P1
    afirmacao: "consistent (R = 2): leitura pela minoria (garage3) indisponível durante a partição (0 leituras ok) e nenhuma leitura desatualizada; timeouts até a detecção (~80 s) e depois \"Could not reach quorum\"."
    fundamento: "Com 1 nó não há R = 2; detecção por pings em ~80 s (E6); RPC espera até 300 s."
    fontes: ["C3, C6", "E6 (minoria 0/836; detecção ≈ 80 s)", ""]
  - id: P2
    afirmacao: "degraded (R = 1, W = 2): leitura pela minoria disponível desde o início da partição, mas desatualizada: o garage3 devolve o valor congelado no momento da partição; taxa de desatualizadas alta (perto de 100% após as primeiras escritas na maioria) e atraso crescente."
    fundamento: "R = 1 lê só a cópia local (C3); o garage3 isolado não recebe as escritas da maioria."
    fontes: ["C3, C6", "", "E3/E4 (R = 1 local)"]
  - id: P3
    afirmacao: "dangerous (R = 1, W = 1): leitura pela minoria disponível e desatualizada, como em degraded; e a escrita pela minoria é aceita (W = 1), ao contrário de consistent e degraded."
    fundamento: "W = 1: o garage3 confirma a escrita sozinho."
    fontes: ["C6", "E5 (dangerous escreve com 1 nó)", ""]
  - id: P4
    afirmacao: "Maioria (leitor via garage2): disponível nos 3 modos; em consistent e degraded praticamente sem leituras desatualizadas; em dangerous pode haver poucas (como no E4: ~2%)."
    fundamento: "garage1 + garage2 formam W = 2; em dangerous a confirmação sai com 1 réplica (C5)."
    fontes: ["C5, C6", "E4 (dangerous 1,8–2,7% sem falha)", "E6 (maioria 99,6%)"]
  - id: P5
    afirmacao: "Listagem pela minoria (A5) segue o GET: indisponível em consistent; disponível em degraded e dangerous, mas sem as chaves criadas pela maioria durante a partição."
    fundamento: "A listagem usa get_range com o mesmo quórum de leitura do GET."
    fontes: ["list.rs l. 69–71; table.rs l. 363–454", "E4"]
  - id: P6
    afirmacao: "Depois de curar: a chave quente volta a ser lida atualizada via garage3 logo que a malha volta; as chaves frias criadas na partição continuam faltando no garage3 em degraded e dangerous (leitura R = 1 sem repair-on-read; anti-entropia em ~8–18 min), mas aparecem em consistent (R = 2)."
    fundamento: "A próxima escrita da chave quente vai a todas as réplicas (C5); anti-entropia e busca de blocos medidas no E7."
    fontes: ["C4, C5", "E7 (tabelas ~475 s; dados ~1 075 s)"]
perguntas_guia:
  - "Monte a tabela teórica (N, R, W, R + W > N) e compare com o observado em cada modo. Onde bateu e onde não bateu?"
  - "Em degraded a minoria responde com valor antigo. Isso é disponibilidade ou erro? Relacione com CAP e PACELC."
  - "Em dangerous a minoria aceita escritas. O que pode acontecer com elas depois de curar (LWW, E8)?"
  - "Quanto tempo dura a janela em que a minoria responde com timeout em consistent? O que isso significa para um cliente?"
  - "Qual modo vocês recomendariam para um sistema de backup? E para um cache de conteúdo público?"
