experimento: E2
titulo: Caminho de uma operação
roteiro: "§4.2 E2; §7.3 E2 (PUT pelo garage1 e GET pelo garage3; qualquer nó é gateway; hash → partição → nós; diagrama de sequência com o momento do quórum)"
previsoes:
  - id: P1
    afirmacao: "Qualquer nó aceita PUT e GET (atua como gateway): PUT por cada nó e GET por cada nó funcionam (9/9), e o log INFO da requisição S3 aparece só no nó que a recebeu."
    fundamento: "Sem nó primário: qualquer nó saudável atende; o servidor S3 loga cada requisição no nó de entrada."
    fontes: ["doc Internals (sem nó primário)", "src/api/common/generic_server.rs l. 170 (log INFO por requisição)"]
  - id: P2
    afirmacao: "PUT de objeto pequeno (< 3072 B, dentro dos metadados) via garage1: RPC de escrita da tabela de objetos para os 3 nós."
    fundamento: "Escrita envia a todas as réplicas de uma vez e retorna ao atingir o quórum W; o resto segue em segundo plano (src/rpc/rpc_helper.rs l. 413–431). N = 3 com 3 nós → as 3 réplicas."
    fontes: ["src/rpc/rpc_helper.rs l. 413–431; src/table/table.rs l. 120–139", "INLINE_THRESHOLD: src/block/manager.rs l. 44"]
  - id: P3
    afirmacao: "GET via garage3 em consistent (R = 2): RPC de leitura da tabela de objetos para 2 nós, sendo um deles o próprio garage3."
    fundamento: "A leitura ordena os nós (próprio nó, mesma zona, menor latência) e só envia os pedidos necessários para o quórum, abrindo outro só se um falhar (src/rpc/rpc_helper.rs l. 337–397)."
    fontes: ["src/rpc/rpc_helper.rs l. 337–397, 627–666", "doc Internals"]
  - id: P4
    afirmacao: "Objeto de 2 MiB (2 blocos de 1 MiB): o PUT envia cada bloco aos 3 nós; o GET via garage3 busca cada bloco de 1 só nó."
    fundamento: "Escrita de bloco usa try_write_many_sets com o mesmo W das tabelas; leitura de bloco percorre os nós um a um e para no primeiro que responde."
    fontes: ["src/block/manager.rs l. 290–325 (leitura) e l. 379–416 (escrita)", "src/model/garage.rs l. 164", "bloco padrão 1 MiB: src/util/config.rs l. 294–296"]
  - id: P5
    afirmacao: "Os metadados de todos os objetos do bucket sdlab ficam na partição = 1º byte do ID do bucket, guardada pelos 3 nós; os blocos vão para a partição do 1º byte do hash Blake2 de cada bloco."
    fundamento: "Chave de partição da tabela de objetos = ID do bucket; para IDs aleatórios o hash é o próprio valor; partição = 8 bits altos do hash; com N = 3 e 3 nós todos guardam todas as partições (E1)."
    fontes: ["src/model/s3/object_table.rs l. 696–700", "src/table/schema.rs l. 25–32", "src/rpc/layout/version.rs l. 102–105"]
perguntas_guia:
  - "Em que momento o cliente recebe a confirmação do PUT? O que acontece com a 3ª réplica depois disso?"
  - "Por que o GET em consistent consulta só 2 nós e não 3? E em degraded?"
  - "Por que não existe servidor central de metadados no Garage? Compare com um sistema com nó mestre."
  - "O roteiro fala em \"hash da chave\": o que muda quando a chave de partição é o bucket? Isso cria um ponto quente?"
